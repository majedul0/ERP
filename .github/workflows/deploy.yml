name: deploy

on:
  push:
    branches: [main]
  # Lets you re-run a deploy, or roll forward again, without an empty commit.
  workflow_dispatch:

# One deploy at a time, and never cancel one half-finished: a run that dies
# between `migrate` and `up -d` leaves new schema against old code.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      # Not `composer setup`: that runs `artisan migrate`, and there is no
      # Postgres on the runner. The suite itself needs none — phpunit.xml
      # forces sqlite :memory:, array cache and a sync queue.
      - name: Prepare environment
        run: cp .env.example .env

      # Also generates resources/js/{actions,routes} via Wayfinder, which
      # tsc and eslint need before they can pass.
      - name: Build assets
        run: npm run build

      - name: Run CI checks
        run: composer ci:check

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on purpose: `latest` is what a bare `docker compose up`
      # follows, and the SHA is what a rollback names.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/majedul0/erp:latest
            ghcr.io/majedul0/erp:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: APP_IMAGE_TAG
          script: |
            set -e
            cd /home/deploy/app

            export APP_IMAGE_TAG="${APP_IMAGE_TAG}"
            echo "Deploying ${APP_IMAGE_TAG}"

            docker compose pull app

            # Migrations run in a one-off container against the new image,
            # before the serving containers are swapped. If this fails the
            # deploy stops here and the old release keeps running.
            docker compose run --rm --no-deps app php artisan migrate --force

            docker compose up -d --remove-orphans

            # Workers cache class definitions per process, so new job code is
            # only picked up by a fresh worker.
            docker compose restart horizon scheduler

            # Prove it actually serves before calling the deploy done.
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8081/up > /dev/null; then
                echo "Healthy after ${i}s"
                docker image prune -f
                exit 0
              fi
              sleep 1
            done

            echo "Health check failed — dumping logs" >&2
            docker compose logs --tail=60 app >&2
            exit 1
        env:
          APP_IMAGE_TAG: ${{ needs.build.outputs.tag }}
