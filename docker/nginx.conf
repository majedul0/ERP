# Inside the container only. TLS and the public domain are CyberPanel's job;
# this listens on plain HTTP and is reached over 127.0.0.1:8080 on the host.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Must be at least as large as PHP's upload_max_filesize, or nginx rejects
    # a logo upload before PHP ever sees it and the app cannot explain why.
    client_max_body_size 20M;

    # CyberPanel terminates TLS, so the scheme reaching us is always http.
    # These let Laravel build correct https:// URLs behind the proxy.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Hashed filenames, so these can be cached hard and for a long time.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded logos and product photos, served through the storage symlink.
    location /storage/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        # Long enough for an invoice export of a few thousand rows.
        fastcgi_read_timeout 60s;

        # nginx defaults to a 4k header buffer. Laravel's
        # AddLinkHeadersForPreloadedAssets middleware emits a `Link:` header
        # naming every preloaded script, stylesheet and font, which comfortably
        # exceeds that — and nginx answers an oversized header with 502 even
        # though PHP returned 200. Without this, every page of the application
        # fails while /up, which preloads nothing, appears healthy.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
    }

    # Dotfiles, except the ACME challenge directory.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
