; Overrides the image's default www pool.
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers periodically so a slow leak in any dependency cannot grow
; unbounded over a long-running container.
pm.max_requests = 500

; php-fpm swallows worker output by default, which loses Laravel's logs.
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
