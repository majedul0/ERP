; Production PHP settings. Anything that differs per environment belongs in
; .env on the VPS, not here.

memory_limit = 512M
max_execution_time = 60

; Logo and product-photo uploads. The app's own limit is 2MB
; (company.storage.logos.max_kilobytes); this has to sit comfortably above it,
; or PHP rejects the file before validation runs and the user gets a vaguer
; error than the app's own message.
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 20

expose_php = Off

; Errors go to the container log, never to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code never changes inside a running container — a new release is a new
; image — so there is nothing to gain from stat-ing every file on every request.
opcache.validate_timestamps = 0
opcache.enable_cli = 0
